
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 케이크 관리 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK (v9 호환성 라이브러리) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e2e8f0;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --danger: #e74c3c;
            --success-bg: #e8f5e9;
            --success-text: #2e7d32;
            --pending-bg: #fff8e1;
            --pending-text: #f57f17;
            --modal-overlay: rgba(0, 0, 0, 0.5);
        }

        .branch-도안점 { background-color: #e3f2fd; color: #1565c0; border-left: 3px solid #1565c0; }
        .branch-둔산점 { background-color: #ede7f6; color: #512da8; border-left: 3px solid #512da8; }
        .branch-갤러리아점 { background-color: #e8f5e9; color: #2e7d32; border-left: 3px solid #2e7d32; }
        .branch-유성점 { background-color: #fce4ec; color: #c2185b; border-left: 3px solid #c2185b; }
        .branch-건양대병원점 { background-color: #fff3e0; color: #e65100; border-left: 3px solid #e65100; }
        .branch-둔곡점 { background-color: #e0f2f1; color: #00796b; border-left: 3px solid #00796b; }
        .branch-기타 { background-color: #eceff1; color: #455a64; border-left: 3px solid #455a64; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; max-width: 1400px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; background: var(--card-bg); padding: 20px 28px;
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); gap: 12px;
        }

        .header-title h1 { font-size: 22px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .header-title p { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        .btn {
            padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
            border: none; cursor: pointer; transition: all 0.2s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background-color: #e2e8f0; }
        .btn-danger { background-color: #fff5f5; color: var(--danger); border: 1px solid #feb2b2; }
        .btn-danger:hover { background-color: #ffe3e3; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .form-control { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; outline: none; width: 100%; }
        .form-control:focus { border-color: var(--primary); }

        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .month-nav { display: flex; align-items: center; gap: 16px; }
        .month-nav h2 { font-size: 20px; font-weight: 700; min-width: 130px; text-align: center; }
        .nav-btn { background: none; border: 1px solid var(--border-color); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background-color: var(--bg-color); }

        .branch-legend { display: flex; gap: 8px; font-size: 11px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-color { width: 10px; height: 10px; border-radius: 2px; }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
            background-color: var(--border-color); border: 1px solid var(--border-color);
            border-radius: 8px; overflow: hidden; width: 100%;
        }

        .day-header { background-color: #f8fafc; padding: 10px 2px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-sub); }
        .day-header:first-child { color: #e53e3e; }
        .day-header:last-child { color: #3182ce; }

        .calendar-day { background-color: var(--card-bg); min-height: 105px; padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .calendar-day.other-month { background-color: #fafafa; opacity: 0.5; }
        .day-number { font-size: 12px; font-weight: 600; margin-bottom: 2px; color: var(--text-main); }
        .calendar-day.today .day-number { background-color: var(--primary); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .event-tag { font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .sidebar-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .badge-count { background: #edf2f7; color: var(--primary); font-size: 12px; padding: 2px 8px; border-radius: 12px; }

        .birthday-list { display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; }
        .birthday-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; }
        .user-info { display: flex; flex-direction: column; gap: 2px; }
        .user-name-branch { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .user-name { font-weight: 700; font-size: 13px; }
        .user-branch-badge { font-size: 10px; padding: 1px 5px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
        .user-detail { font-size: 11px; color: var(--text-sub); }

        .status-badge { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 20px; white-space: nowrap; }
        .status-badge.completed { background-color: var(--success-bg); color: var(--success-text); }
        .status-badge.pending { background-color: var(--pending-bg); color: var(--pending-text); }

        .summary-box { display: flex; gap: 12px; margin-bottom: 12px; }
        .summary-card { flex: 1; padding: 12px; border-radius: 8px; text-align: center; background: #f8fafc; border: 1px solid var(--border-color); }
        .summary-card.completed { background-color: var(--success-bg); }
        .summary-card.pending { background-color: var(--pending-bg); }
        .summary-card .num { font-size: 20px; font-weight: 700; margin-top: 4px; }
        .summary-card.completed .num { color: var(--success-text); }
        .summary-card.pending .num { color: var(--pending-text); }

        .empty-state { text-align: center; padding: 20px 0; color: var(--text-sub); font-size: 12px; }
        footer { margin-top: 20px; background: #f8fafc; border: 1px dashed var(--border-color); padding: 14px 20px; border-radius: 8px; font-size: 13px; color: #64748b; text-align: center; }

        /* 모달 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--modal-overlay); z-index: 1000; justify-content: center; align-items: center; padding: 12px; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 1000px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: #f8fafc; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub); }
        .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }

        .modal-filter-bar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; background: #fff; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); flex-wrap: wrap; }
        .form-grid { display: grid; grid-template-columns: repeat(6, 1fr) auto; gap: 8px; margin-bottom: 20px; align-items: flex-end; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 11px; font-weight: 600; color: var(--text-sub); }

        .table-container { border: 1px solid var(--border-color); border-radius: 8px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; min-width: 750px; }
        th { background-color: #f8fafc; padding: 10px; font-weight: 600; color: var(--text-sub); border-bottom: 1px solid var(--border-color); }
        td { padding: 10px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }

        .check-container { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 12px; font-weight: 600; }
        .check-container input { cursor: pointer; width: 16px; height: 16px; accent-color: #2e7d32; }

        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            body { padding: 10px; }
            header { flex-direction: column; align-items: flex-start; padding: 14px 16px; }
            header .btn { width: 100%; }
            .card { padding: 12px; }
            .calendar-header { flex-direction: column; align-items: flex-start; }
            .month-nav { width: 100%; justify-content: space-between; }
            .calendar-day { min-height: 62px; padding: 3px; gap: 2px; }
            .event-tag { font-size: 9px; padding: 1px 2px; }
            .form-grid { grid-template-columns: 1fr 1fr; }
            .form-grid #savePersonBtn { grid-column: span 2; }
            .modal-filter-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>🎂 생일 케이크 관리</h1>
            <p>다중 접속 실시간 동기화 및 지급 체크 시스템 🟢</p>
        </div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <select id="mainFilterBranch" class="form-control" style="width: auto; padding: 8px 12px;">
                <option value="전체">전체 근무지 보기</option>
                <option value="도안점">도안점</option>
                <option value="둔산점">둔산점</option>
                <option value="갤러리아점">갤러리아점</option>
                <option value="유성점">유성점</option>
                <option value="건양대병원점">건양대병원점</option>
                <option value="둔곡점">둔곡점</option>
            </select>
            <select id="mainFilterJob" class="form-control" style="width: auto; padding: 8px 12px;">
                <option value="전체">전체 직종 보기</option>
                <option value="매장">매장</option>
                <option value="공장">공장</option>
                <option value="1공장">1공장</option>
                <option value="2공장">2공장</option>
                <option value="케익">케익</option>
                <option value="포장">포장</option>
                <option value="배송">배송</option>
                <option value="관리">관리</option>
            </select>
            <button class="btn btn-primary" id="openManageModalBtn">⚙️ 생일자 추가/관리</button>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="card">
            <div class="calendar-header">
                <div class="month-nav">
                    <button class="nav-btn" id="prevMonthBtn">&lt;</button>
                    <h2 id="currentMonthTitle">2026년 8월</h2>
                    <button class="nav-btn" id="nextMonthBtn">&gt;</button>
                </div>
                <div class="branch-legend">
                    <div class="legend-item"><span class="legend-color" style="background:#1565c0;"></span>도안점</div>
                    <div class="legend-item"><span class="legend-color" style="background:#512da8;"></span>둔산점</div>
                    <div class="legend-item"><span class="legend-color" style="background:#2e7d32;"></span>갤러리아점</div>
                    <div class="legend-item"><span class="legend-color" style="background:#c2185b;"></span>유성점</div>
                    <div class="legend-item"><span class="legend-color" style="background:#e65100;"></span>건양대병원점</div>
                    <div class="legend-item"><span class="legend-color" style="background:#00796b;"></span>둔곡점</div>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="side-panel">
            <div class="card">
                <div class="sidebar-title">
                    <span>🎉 이번 달 생일자</span>
                    <span class="badge-count" id="monthlyCount">0명</span>
                </div>
                <div class="birthday-list" id="monthlyBirthdayList"></div>
            </div>
            <div class="card">
                <div class="sidebar-title"><span>📊 이번 달 지급 현황</span></div>
                <div class="summary-box">
                    <div class="summary-card completed">
                        <div style="font-size:12px; color:var(--success-text);">지급 완료</div>
                        <div class="num" id="completedCount">0</div>
                    </div>
                    <div class="summary-card pending">
                        <div style="font-size:12px; color:var(--pending-text);">지급 예정</div>
                        <div class="num" id="pendingCount">0</div>
                    </div>
                </div>
                <div class="birthday-list" id="statusBirthdayList"></div>
            </div>
        </div>
    </div>

    <footer>입사일로부터 3개월이 지난 날부터 생일 케이크 대상입니다. (미달자도 직원 목록 및 관리에서 확인 가능)</footer>

    <!-- 관리 모달 -->
    <div class="modal" id="manageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>직원 정보 추가 및 케이크 지급 관리 (전체 직원 목록)</h3>
                <button class="close-btn" id="closeManageModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addPersonForm">
                    <input type="hidden" id="editId" value="">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="inputBranch">근무지</label>
                            <select id="inputBranch" class="form-control" required>
                                <option value="도안점">도안점</option>
                                <option value="둔산점">둔산점</option>
                                <option value="갤러리아점">갤러리아점</option>
                                <option value="유성점">유성점</option>
                                <option value="건양대병원점">건양대병원점</option>
                                <option value="둔곡점">둔곡점</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="inputJob">직종</label>
                            <select id="inputJob" class="form-control" required>
                                <option value="매장">매장</option>
                                <option value="공장">공장</option>
                                <option value="1공장">1공장</option>
                                <option value="2공장">2공장</option>
                                <option value="케익">케익</option>
                                <option value="포장">포장</option>
                                <option value="배송">배송</option>
                                <option value="관리">관리</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="inputPosition">직급</label>
                            <input type="text" id="inputPosition" class="form-control" placeholder="예: 매니저" required>
                        </div>
                        <div class="form-group">
                            <label for="inputName">이름</label>
                            <input type="text" id="inputName" class="form-control" placeholder="예: 홍길동" required>
                        </div>
                        <div class="form-group">
                            <label for="inputBirth">생년월일</label>
                            <input type="date" id="inputBirth" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="inputHireDate">입사일</label>
                            <input type="date" id="inputHireDate" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="savePersonBtn" style="height: 35px; grid-column: span 6;">추가</button>
                    </div>
                </form>

                <div class="modal-filter-bar">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <label for="modalFilterBranch" style="font-size:12px; font-weight:600; color:var(--text-sub);">근무지 필터:</label>
                        <select id="modalFilterBranch" class="form-control" style="padding:4px 8px;">
                            <option value="전체">전체</option>
                            <option value="도안점">도안점</option>
                            <option value="둔산점">둔산점</option>
                            <option value="갤러리아점">갤러리아점</option>
                            <option value="유성점">유성점</option>
                            <option value="건양대병원점">건양대병원점</option>
                            <option value="둔곡점">둔곡점</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <label for="modalFilterJob" style="font-size:12px; font-weight:600; color:var(--text-sub);">직종 필터:</label>
                        <select id="modalFilterJob" class="form-control" style="padding:4px 8px;">
                            <option value="전체">전체</option>
                            <option value="매장">매장</option>
                            <option value="공장">공장</option>
                            <option value="1공장">1공장</option>
                            <option value="2공장">2공장</option>
                            <option value="케익">케익</option>
                            <option value="포장">포장</option>
                            <option value="배송">배송</option>
                            <option value="관리">관리</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px; flex:1;">
                        <label for="modalSearchName" style="font-size:12px; font-weight:600; color:var(--text-sub);">이름 검색:</label>
                        <input type="text" id="modalSearchName" class="form-control" placeholder="이름 검색..." style="padding:4px 8px;">
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>근무지</th>
                                <th>직종</th>
                                <th>직급</th>
                                <th>이름</th>
                                <th>생년월일</th>
                                <th>입사일 (대상 여부)</th>
                                <th style="text-align: center; width: 90px;">지급 체크</th>
                                <th style="width: 100px; text-align: center;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="personTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer" style="padding:12px 20px; border-top:1px solid var(--border-color); text-align:right;">
                <button class="btn btn-secondary" id="closeModalFooterBtn">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBwpbvoxzFfRrFfHHVXPEcwNf5cinl_21M",
            authDomain: "birthday-management-34d5f.firebaseapp.com",
            databaseURL: "https://birthday-management-34d5f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "birthday-management-34d5f",
            storageBucket: "birthday-management-34d5f.appspot.com",
            messagingSenderId: "1019385592515",
            appId: "1:1019385592515:web:def95edf8be36c27af4076",
            measurementId: "G-07GE339LQD"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const personsRef = database.ref('persons');

        const TODAY = new Date();
        let persons = []; 
        let currentYear = TODAY.getFullYear();
        let currentMonth = TODAY.getMonth();

        // DOM elements
        const calendarGrid = document.getElementById('calendarGrid');
        const currentMonthTitle = document.getElementById('currentMonthTitle');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');
        const monthlyBirthdayList = document.getElementById('monthlyBirthdayList');
        const statusBirthdayList = document.getElementById('statusBirthdayList');
        const monthlyCount = document.getElementById('monthlyCount');
        const completedCount = document.getElementById('completedCount');
        const pendingCount = document.getElementById('pendingCount');
        const mainFilterBranch = document.getElementById('mainFilterBranch');
        const mainFilterJob = document.getElementById('mainFilterJob');

        const manageModal = document.getElementById('manageModal');
        const openManageModalBtn = document.getElementById('openManageModalBtn');
        const closeManageModalBtn = document.getElementById('closeManageModalBtn');
        const closeModalFooterBtn = document.getElementById('closeModalFooterBtn');
                
        const addPersonForm = document.getElementById('addPersonForm');
        const editIdInput = document.getElementById('editId');
        const inputBranch = document.getElementById('inputBranch');
        const inputJob = document.getElementById('inputJob');
        const inputPosition = document.getElementById('inputPosition');
        const inputName = document.getElementById('inputName');
        const inputBirth = document.getElementById('inputBirth');
        const inputHireDate = document.getElementById('inputHireDate');
        const savePersonBtn = document.getElementById('savePersonBtn');
                
        const modalFilterBranch = document.getElementById('modalFilterBranch');
        const modalFilterJob = document.getElementById('modalFilterJob');
        const modalSearchName = document.getElementById('modalSearchName');
        const personTableBody = document.getElementById('personTableBody');

        function initApp() {
            listenToFirebaseRealtime();
            setupEventListeners();
        }

        function listenToFirebaseRealtime() {
            personsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                persons = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        let item = data[key];
                        const validJobs = ['매장', '공장', '1공장', '2공장', '케익', '포장', '배송', '관리'];
                        if (!item.job || !validJobs.includes(item.job)) {
                            item.job = '매장';
                        }
                        persons.push({ id: key, ...item });
                    });
                }
                renderAll();
            }, (error) => {
                alert("데이터 읽기 권한 오류: " + error.message);
            });
        }

        function renderAll() {
            renderCalendar();
            renderMainLists();
            renderTable();
        }

        function getBranchClass(branch) {
            const validBranches = ['도안점', '둔산점', '갤러리아점', '유성점', '건양대병원점', '둔곡점'];
            return validBranches.includes(branch) ? `branch-${branch}` : 'branch-기타';
        }

        function isEligible(hireDateStr) {
            if (!hireDateStr) return false;
            const hire = new Date(hireDateStr);
            const eligibleDate = new Date(hire.getFullYear(), hire.getMonth() + 3, hire.getDate());
            const todayDateOnly = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
            return todayDateOnly >= eligibleDate;
        }

        function getFilteredPersons() {
            const selectedBranch = mainFilterBranch.value;
            const selectedJob = mainFilterJob.value;
            return persons.filter(p => {
                if (!p) return false;
                if (selectedBranch !== '전체' && p.branch !== selectedBranch) return false;
                if (selectedJob !== '전체' && p.job !== selectedJob) return false;
                return true;
            });
        }

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            currentMonthTitle.textContent = `${currentYear}년 ${currentMonth + 1}월`;

            const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
            daysOfWeek.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendarGrid.appendChild(dayHeader);
            });

            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const startDayIndex = firstDay.getDay();
            const totalDays = lastDay.getDate();
            const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();

            for (let i = startDayIndex - 1; i >= 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day other-month';
                dayDiv.innerHTML = `<span class="day-number">${prevLastDay - i}</span>`;
                calendarGrid.appendChild(dayDiv);
            }

            const currentFiltered = getFilteredPersons();

            for (let day = 1; day <= totalDays; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                
                if (currentYear === TODAY.getFullYear() && currentMonth === TODAY.getMonth() && day === TODAY.getDate()) {
                    dayDiv.classList.add('today');
                }

                dayDiv.innerHTML = `<span class="day-number">${day}</span>`;

                const dayBirthdays = currentFiltered.filter(p => {
                    if (!p || !p.birth) return false;
                    const bDate = new Date(p.birth);
                    if (bDate.getMonth() !== currentMonth || bDate.getDate() !== day) return false;
                    return isEligible(p.hireDate);
                });

                dayBirthdays.forEach(person => {
                    const tag = document.createElement('div');
                    tag.className = `event-tag ${getBranchClass(person.branch)}`;
                    const tagText = `[${person.job}] ${person.name}`;
                    tag.innerHTML = `<span>${tagText}</span><span>${person.given ? '✅' : '🎂'}</span>`;
                    dayDiv.appendChild(tag);
                });

                calendarGrid.appendChild(dayDiv);
            }

            const totalCells = startDayIndex + totalDays;
            const nextDays = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= nextDays; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day other-month';
                dayDiv.innerHTML = `<span class="day-number">${i}</span>`;
                calendarGrid.appendChild(dayDiv);
            }
        }

        function renderMainLists() {
            monthlyBirthdayList.innerHTML = '';
            statusBirthdayList.innerHTML = '';

            const currentFiltered = getFilteredPersons();
            const monthlyPersons = currentFiltered.filter(p => {
                if (!p || !p.birth) return false;
                const bDate = new Date(p.birth);
                if (bDate.getMonth() !== currentMonth) return false;
                return isEligible(p.hireDate);
            });

            monthlyPersons.sort((a, b) => new Date(a.birth).getDate() - new Date(b.birth).getDate());
            monthlyCount.textContent = `${monthlyPersons.length}명`;

            if (monthlyPersons.length === 0) {
                monthlyBirthdayList.innerHTML = `<div class="empty-state">이번 달 생일 대상자가 없습니다.</div>`;
                statusBirthdayList.innerHTML = `<div class="empty-state">이번 달 지급 내역이 없습니다.</div>`;
                completedCount.textContent = '0';
                pendingCount.textContent = '0';
                return;
            }

            let compCount = 0;
            let pendCount = 0;

            monthlyPersons.forEach(person => {
                const bDate = new Date(person.birth);
                const birthDayStr = `${currentMonth + 1}월 ${bDate.getDate()}일`;
                const isCompleted = person.given === true;

                if (isCompleted) compCount++;
                else pendCount++;

                const bItem = document.createElement('div');
                bItem.className = 'birthday-item';
                bItem.innerHTML = `
                    <div class="user-info">
                        <div class="user-name-branch">
                            <span class="user-name">${person.name} (${person.position || ''})</span>
                            <span class="user-branch-badge ${getBranchClass(person.branch)}">${person.branch}</span>
                        </div>
                        <span class="user-detail">📅 생일: ${birthDayStr} / 직종: ${person.job}</span>
                    </div>
                `;
                monthlyBirthdayList.appendChild(bItem);

                const sItem = document.createElement('div');
                sItem.className = 'birthday-item';
                sItem.innerHTML = `
                    <div class="user-info">
                        <div class="user-name-branch">
                            <span class="user-name">${person.name}</span>
                            <span class="user-detail">(${birthDayStr} / ${person.job})</span>
                        </div>
                    </div>
                    <div>
                        <span class="status-badge ${isCompleted ? 'completed' : 'pending'}">
                            ${isCompleted ? '지급 완료' : '지급 예정'}
                        </span>
                    </div>
                `;
                statusBirthdayList.appendChild(sItem);
            });

            completedCount.textContent = compCount;
            pendingCount.textContent = pendCount;
        }

        function renderTable() {
            personTableBody.innerHTML = '';

            const branchVal = modalFilterBranch.value;
            const jobVal = modalFilterJob.value;
            const searchVal = modalSearchName.value.trim().toLowerCase();

            const filteredPersons = persons.filter(p => {
                if (!p) return false;
                const matchBranch = (branchVal === '전체') || (p.branch === branchVal);
                const matchJob = (jobVal === '전체') || (p.job === jobVal);
                const matchName = p.name ? p.name.toLowerCase().includes(searchVal) : false;
                return matchBranch && matchJob && matchName;
            });

            filteredPersons.sort((a, b) => a.name.localeCompare(b.name));

            if (filteredPersons.length === 0) {
                personTableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--text-sub); padding:20px;">검색 결과가 없습니다.</td></tr>`;
                return;
            }

            filteredPersons.forEach(person => {
                const tr = document.createElement('tr');
                const isChecked = person.given ? 'checked' : '';
                const eligible = isEligible(person.hireDate);

                tr.innerHTML = `
                    <td><span class="user-branch-badge ${getBranchClass(person.branch)}">${person.branch}</span></td>
                    <td>${person.job || '-'}</td>
                    <td>${person.position || '-'}</td>
                    <td><strong>${person.name}</strong></td>
                    <td>${person.birth}</td>
                    <td>${person.hireDate || '-'} <span style="font-size:11px; font-weight:600; color:${eligible ? 'var(--success-text)' : 'var(--pending-text)'}">(${eligible ? '대상' : '3개월 미만'})</span></td>
                    <td style="text-align: center;">
                        <label class="check-container">
                            <input type="checkbox" ${isChecked} onchange="toggleCakeStatus('${person.id}', this.checked)">
                            <span style="color:${person.given ? 'var(--success-text)' : 'var(--text-sub)'}">${person.given ? '완료' : '예정'}</span>
                        </label>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn btn-secondary btn-sm" onclick="editPerson('${person.id}')">수정</button>
                        <button class="btn btn-danger btn-sm" onclick="deletePerson('${person.id}')">삭제</button>
                    </td>
                `;
                personTableBody.appendChild(tr);
            });
        }

        window.toggleCakeStatus = function(id, isChecked) {
            personsRef.child(id).update({
                given: isChecked
            }).catch(err => alert("지급 상태 변경 실패: " + err.message));
        };

        addPersonForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = editIdInput.value;
            
            const payload = {
                branch: inputBranch.value,
                job: inputJob.value,
                position: inputPosition.value.trim(),
                name: inputName.value.trim(),
                birth: inputBirth.value,
                hireDate: inputHireDate.value
            };

            if (id) {
                const existing = persons.find(p => p.id === id);
                payload.given = existing && existing.given ? true : false;
                personsRef.child(id).update(payload).then(() => resetForm()).catch(err => alert("수정 실패: " + err.message));
            } else {
                payload.given = false;
                personsRef.push(payload).then(() => resetForm()).catch(err => alert("추가 실패: " + err.message));
            }
        });

        window.editPerson = function(id) {
            const person = persons.find(p => p.id === id);
            if (person) {
                editIdInput.value = person.id;
                inputBranch.value = person.branch || '도안점';
                inputJob.value = person.job || '매장';
                inputPosition.value = person.position || '';
                inputName.value = person.name;
                inputBirth.value = person.birth;
                inputHireDate.value = person.hireDate || '';
                savePersonBtn.textContent = '수정 완료';
            }
        };

        window.deletePerson = function(id) {
            if (confirm('해당 직원 정보를 삭제하시겠습니까?')) {
                personsRef.child(id).remove().then(() => {
                    if (editIdInput.value === id) resetForm();
                }).catch(err => alert("삭제 실패: " + err.message));
            }
        };

        function resetForm() {
            editIdInput.value = '';
            inputBranch.value = '도안점';
            inputJob.value = '매장';
            inputPosition.value = '';
            inputName.value = '';
            inputBirth.value = '';
            inputHireDate.value = '';
            savePersonBtn.textContent = '추가';
        }

        function setupEventListeners() {
            mainFilterBranch.addEventListener('change', renderAll);
            mainFilterJob.addEventListener('change', renderAll);
            modalFilterBranch.addEventListener('change', renderTable);
            modalFilterJob.addEventListener('change', renderTable);
            modalSearchName.addEventListener('input', renderTable);

            prevMonthBtn.addEventListener('click', () => {
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                renderAll();
            });

            nextMonthBtn.addEventListener('click', () => {
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                renderAll();
            });

            openManageModalBtn.addEventListener('click', () => manageModal.classList.add('active'));

            const closeModal = () => {
                manageModal.classList.remove('active');
                resetForm();
            };

            closeManageModalBtn.addEventListener('click', closeModal);
            closeModalFooterBtn.addEventListener('click', closeModal);
            manageModal.addEventListener('click', (e) => { if (e.target === manageModal) closeModal(); });
        }

        initApp();
    </script>
</body>
</html>
